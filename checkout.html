<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | STONER BEAR</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter,sans-serif;
background:#050505;
color:#fff;
}

header{
padding:30px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.08);
}

header h1{
font-family:"Cormorant Garamond",serif;
font-size:42px;
letter-spacing:6px;
}

.container{
max-width:1200px;
margin:50px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:40px;
padding:0 30px;
}

.form-box,
.summary{
background:#111;
padding:35px;
border-radius:20px;
border:1px solid rgba(212,175,55,.15);
}

h2{
font-family:"Cormorant Garamond",serif;
font-size:32px;
margin-bottom:25px;
letter-spacing:2px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-size:14px;
color:#ccc;
}

input,
select,
textarea{

width:100%;
padding:15px;
background:#181818;
border:1px solid #333;
color:white;
border-radius:12px;
font-size:15px;

}

textarea{
min-height:120px;
resize:vertical;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.summary-item{
display:flex;
justify-content:space-between;
margin:18px 0;
font-size:15px;
}

.total{
border-top:1px solid #333;
margin-top:25px;
padding-top:25px;
font-size:24px;
font-weight:bold;
color:#D4AF37;
display:flex;
justify-content:space-between;
}

button{
margin-top:30px;
width:100%;
padding:18px;
border:none;
border-radius:40px;
background:#D4AF37;
color:black;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.row{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<h1>STONER BEAR</h1>

<p>Secure Checkout</p>

</header>

<div class="container">

<div class="form-box">

<h2>Customer Information</h2>

<form id="checkoutForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Email Address</label>
<input type="email" id="email" required>

<label>Phone Number</label>
<input type="tel" id="phone" required>

<h2 style="margin-top:45px;">Shipping Address</h2>

<div class="row">

<div>
<label>Country</label>
<input type="text" id="country" required>
</div>

<div>
<label>State</label>
<input type="text" id="state" required>
</div>

</div>

<div class="row">

<div>
<label>City</label>
<input type="text" id="city" required>
</div>

<div>
<label>Postal Code</label>
<input type="text" id="zip">
</div>

</div>

<label>Street Address</label>
<input type="text" id="address" required>

<label>Apartment / Suite (Optional)</label>
<input type="text" id="apartment">

<label>Order Notes</label>
<textarea id="notes"></textarea>
