<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | STONER BEAR</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050505;
font-family:Inter,sans-serif;
color:white;

}

a{

text-decoration:none;

}

header{

padding:30px 8%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.08);

}

.logo{

font-size:38px;
font-family:"Cormorant Garamond",serif;
letter-spacing:6px;
font-weight:700;

}

.container{

max-width:1300px;
margin:60px auto;
padding:0 30px;

display:grid;
grid-template-columns:2fr 1fr;
gap:40px;

}

.checkout{

background:#111;
padding:40px;
border-radius:20px;
border:1px solid rgba(212,175,55,.12);

}

.summary{

background:#111;
padding:40px;
border-radius:20px;
border:1px solid rgba(212,175,55,.12);
height:max-content;

}

.section-title{

font-family:"Cormorant Garamond",serif;
font-size:34px;
margin-bottom:25px;
letter-spacing:2px;

}

.row{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;

margin-bottom:20px;

}

.input-group{

margin-bottom:20px;

}

label{

display:block;
margin-bottom:8px;
font-size:14px;
color:#ccc;

}

input,
select,
textarea{

width:100%;
padding:16px;

background:#181818;

border:1px solid #2a2a2a;

border-radius:12px;

color:white;

font-size:15px;

outline:none;

transition:.3s;

}

input:focus,
textarea:focus,
select:focus{

border-color:#D4AF37;

}

textarea{

height:130px;
resize:none;

}

.summary-item{

display:flex;
justify-content:space-between;
margin:18px 0;

}

.total{

display:flex;
justify-content:space-between;

border-top:1px solid #333;

padding-top:25px;
margin-top:25px;

font-size:24px;

font-weight:bold;

color:#D4AF37;

}

.checkout-btn{

margin-top:30px;

width:100%;

padding:18px;

border:none;

border-radius:40px;

background:#D4AF37;

color:black;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.checkout-btn:hover{

background:white;

}

.instagram{

margin-top:15px;

background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);

color:white;

}

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

.row{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

STONER BEAR

</div>

</header>

<div class="container">

<div class="checkout">

<h2 class="section-title">

Customer Information

</h2>

<form id="checkoutForm">

<div class="row">

<div class="input-group">

<label>Full Name *</label>

<input
type="text"
id="name"
required>

</div>

<div class="input-group">

<label>Email Address *</label>

<input
type="email"
id="email"
required>

</div>

</div>

<div class="row">

<div class="input-group">

<label>Phone Number *</label>

<input
type="tel"
id="phone"
required>

</div>

<div class="input-group">

<label>Country *</label>

<input
type="text"
id="country"
required>

</div>

</div>
<div class="input-group">

<label>State / Province *</label>

<input
type="text"
id="state"
required>

</div>

</div>

<div class="row">

<div class="input-group">

<label>City *</label>

<input
type="text"
id="city"
required>

</div>

<div class="input-group">

<label>ZIP / Postal Code</label>

<input
type="text"
id="zip">

</div>

</div>

<div class="input-group">

<label>Street Address *</label>

<input
type="text"
id="address"
required>

</div>

<div class="input-group">

<label>Apartment / Suite (Optional)</label>

<input
type="text"
id="apartment">

</div>

<div class="input-group">

<label>Order Notes (Optional)</label>

<textarea
id="notes"
placeholder="Anything we should know about your order?"></textarea>

</div>

</form>

</div>

<div class="summary">

<h2 class="section-title">

Order Summary

</h2>

<div id="cartItems">

</div>

<div class="summary-item">

<span>Subtotal</span>

<span id="subtotal">$0</span>

</div>

<div class="summary-item">

<span>Shipping</span>

<span id="shipping">

FREE

</span>

</div>

<div class="total">

<span>Total</span>

<span id="total">$0</span>

</div>

<button
class="checkout-btn"
onclick="placeOrder()">

Complete Order on WhatsApp

</button>

<button
class="checkout-btn instagram"
onclick="window.location.href='https://instagram.com/stonerbear23'">

Message us on Instagram

</button>

</div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let subtotal = 0;

const cartContainer = document.getElementById("cartItems");

if(cart.length===0){

cartContainer.innerHTML="<p>Your cart is empty.</p>";

}else{

cart.forEach(item=>{

const total=item.price*item.quantity;

subtotal+=total;

cartContainer.innerHTML+=`

<div class="summary-item">

<span>

${item.name}<br>

<small>Size: ${item.size} | Qty: ${item.quantity}</small>

</span>

<span>

$${total}

</span>

</div>

`;

});

}

document.getElementById("subtotal").innerHTML="$"+subtotal;

document.getElementById("total").innerHTML="$"+subtotal;
  function placeOrder(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const phone=document.getElementById("phone").value.trim();
const country=document.getElementById("country").value.trim();
const state=document.getElementById("state").value.trim();
const city=document.getElementById("city").value.trim();
const zip=document.getElementById("zip").value.trim();
const address=document.getElementById("address").value.trim();
const apartment=document.getElementById("apartment").value.trim();
const notes=document.getElementById("notes").value.trim();

if(
!name||
!email||
!phone||
!country||
!state||
!city||
!address
){

alert("Please fill in all required fields.");

return;

}

if(cart.length===0){

alert("Your cart is empty.");

return;

}

let orderItems="";

cart.forEach(item=>{

orderItems+=
`• ${item.name}
Size: ${item.size}
Quantity: ${item.quantity}
Price: $${item.price * item.quantity}

`;

});

const shipping="FREE";

const message=`🛍️ STONER BEAR ORDER

CUSTOMER INFORMATION

Name: ${name}
Email: ${email}
Phone: ${phone}

SHIPPING ADDRESS

Country: ${country}
State: ${state}
City: ${city}
Address: ${address}
Apartment: ${apartment}
ZIP: ${zip}

ORDER DETAILS

${orderItems}

Subtotal: $${subtotal}
Shipping: ${shipping}

TOTAL: $${subtotal}

Notes:
${notes}

Thank you for shopping with STONER BEAR.`;

window.open(
"https://wa.me/2348103859432?text="+encodeURIComponent(message),
"_blank"
);

}

</script>

</body>

</html>
