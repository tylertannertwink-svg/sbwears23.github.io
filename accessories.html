<!DOCTYPE html>
<html>
<head>
    <title>Accessories - Stoner Bear</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 3px;
        }

        h1 {
            font-weight: 300;
        }

        .nav {
            text-align: center;
            margin: 30px 0;
        }

        .nav a {
            color: gold;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav a:hover {
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            padding: 60px 40px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: #111;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: .3s;
            border: 1px solid rgba(255,215,0,.15);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 35px rgba(255,215,0,.25);
        }

        .card img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h3 {
            margin: 15px 0 8px;
        }

        .price {
            color: gold;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background: gold;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: .3s;
        }

        button:hover {
            background: #caa400;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #aaa;
            border-top: 1px solid rgba(255,255,255,.1);
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <h1>STONER BEAR ACCESSORIES</h1>
</header>

<div class="nav">
    <a href="hoodies.html">Hoodies</a>
    <a href="classictee.html">Classic Tees</a>
    <a href="cart.html">Cart</a>
</div>

<div class="grid">

    <div class="card">
        <img src="antisocial-baseball-cap.jpeg" alt="Antisocial Baseball Cap">
        <h3>Antisocial Baseball Cap</h3>
        <div class="price">$25</div>
        <button onclick="addToCart('Antisocial Baseball Cap',25)">
            Add to Cart
        </button>
    </div>

    <div class="card">
        <img src="antisocial-headwarmer.jpeg" alt="Antisocial Headwarmer">
        <h3>Antisocial Headwarmer</h3>
        <div class="price">$25</div>
        <button onclick="addToCart('Antisocial Headwarmer',25)">
            Add to Cart
        </button>
    </div>

    <div class="card">
        <img src="stonerbear-headwarmer.jpeg" alt="Stoner Bear Headwarmer">
        <h3>Stoner Bear Headwarmer</h3>
        <div class="price">$25</div>
        <button onclick="addToCart('Stoner Bear Headwarmer',25)">
            Add to Cart
        </button>
    </div>

    <div class="card">
        <img src="antisocial-socks.jpeg" alt="Antisocial Socks">
        <h3>Antisocial Socks</h3>
        <div class="price">$15</div>
        <button onclick="addToCart('Antisocial Socks',15)">
            Add to Cart
        </button>
    </div>

</div>

<footer>
    © 2026 STONER BEAR. ALL RIGHTS RESERVED.
</footer>

<script>

function addToCart(name, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let existing = cart.find(item => item.name === name);

    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({
            name: name,
            price: price,
            quantity: 1,
            size: "N/A"
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(name + " has been added to your cart.");
}

</script>

</body>
</html>
